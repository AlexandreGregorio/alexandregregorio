# Gera as imagens do perfil (cobrinha + cards de estatísticas) e publica no branch "output".
# Não depende de serviços externos: tudo é gerado aqui, com os dados públicos do GitHub.
name: Imagens do perfil

on:
  schedule:
    - cron: "17 */12 * * *"   # a cada 12 horas
  workflow_dispatch:           # botão "Run workflow" na aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cobrinha comendo as contribuições (versões clara e escura)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Cards de estatísticas e linguagens
      - name: Gerar cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}
        run: python3 .github/scripts/cards.py dist

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
